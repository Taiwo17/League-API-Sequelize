apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: league-platform

servers: 1
agents: 2

image: rancher/k3s:v1.35.5-k3s1

kubeAPI:
  host: "127.0.0.1"
  hostIP: "127.0.0.1"
  hostPort: "6445"

ports:
- port: "127.0.0.1:18080:80"
  nodeFilters:
  - loadbalancer
- port: "127.0.0.1:18443:443"
  nodeFilters:
  - loadbalancer

registries:
  create:
    name: league-registry.localhost
    host: "127.0.0.1"
    hostPort: "5001"

options:
  k3d:
    wait: true
    timeout: "180s"

  k3s:
    extraArgs:
    - arg: "--disable=traefik"
      nodeFilters:
      - server:*

  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
