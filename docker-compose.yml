name: league-api

# Using this instead of putting everything in the env section
x-app-environment: &app-environment
  NODE_ENV: production
  PORT: '4500'
  DB_HOST: mysql
  DB_PORT: '3306'
  DB_NAME: ${DB_NAME:?Set DB_NAME}
  DB_USER: ${DB_USER:?Set DB_USER}
  DB_PASSWORD: ${DB_PASSWORD:? Set DB_PASSWORD}

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to be published image reference}
    init: true
    restart: unless-stopped
    env_file:
      - .env.app
    environment: *app-environment
    ports:
      - '127.0.0.1:4500:4500'
    depends_on:
      mysql:
        condition: service_healthy
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: '0.50'
    mem_limit: 512m
    logging: *logging

  migrate:
    image: ${MIGRATION_IMAGE:?Set MIGRATION_IMAGE to a published image reference}
    profiles:
      - tools
    init: true
    restart: 'no'
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: '0.50'
    mem_limit: 512m
    logging: *logging

  mysql:
    image: ${MYSQL_IMAGE:?Set MYSQL_IMAGE to a verified MYSQL 8.4 image reference}
    restart: unless-stopped
    ports:
      - '127.0.0.1:3307:3306'
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME}
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql --protocol=TCP -h 127.0.0.1
          -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}"
          -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 60s
    cpus: '1.00'
    mem_limit: 1g
    logging: *logging

volumes:
  mysql_data:

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
